[project]
name = "pysub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    # common dependencies
    "accelerate>=1.14.0",
    "annotated-types==0.7.0",
    "anyio==4.14.1",
    "attrs==26.1.0",
    "audioop-lts>=0.2.2",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.7",
    "configargparse>=1.7.5",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.5.6",
    "decorator==5.3.1",
    "distro==1.9.0",
    "faster-whisper>=1.2.1",
    "filelock==3.29.4",
    "fsspec==2026.6.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "jinja2==3.1.6",
    "jiter==0.16.0",
    "librosa>=0.11.0",
    "llvmlite==0.47.0",
    "markupsafe==3.0.3",
    "more-itertools==11.1.0",
    "moviepy==2.2.1",
    "mpmath==1.3.0",
    "nagisa>=0.3.0",
    "networkx==3.6.1",
    "numba==0.65.1",
    "numpy==2.4.6",
    "openai==1.86.0",
    "pillow==11.3.0",
    "proglog==0.1.12",
    "pycountry>=26.2.16",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydub>=0.25.1",
    "pyrsistent==0.20.0",
    "python-dotenv==1.2.2",
    "regex==2026.6.28",
    "requests==2.32.4",
    "secret-type>=0.3.0",
    "setuptools==82.0.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "soynlp>=0.0.493",
    "srt==3.5.3",
    "tiktoken==0.13.0",
    "toml>=0.10.2",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "tqdm==4.67.1",
    "transformers>=5.13.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "webvtt-py>=0.5.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project.scripts]
pysub = "pysub.cli:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
nano-vllm = { path = "acestep/third_parts/nano-vllm" }
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[tool.ruff.lint]
ignore = ["E501"]

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-function-docstring", "too-many-arguments", "line-too-long", "too-many-positional-arguments", "import-error"]

[tool.mypy]
disable_error_code = ["import-not-found", "import-untyped"]

[dependency-groups]
dev = [
    "python-lsp-server>=1.14.0",
    "ty>=0.0.65",
    "types-jsonschema>=4.26.0.20260518",
    "types-pycountry>=24.6.0.20251119",
    "types-requests>=2.33.0.20260518",
    "types-tqdm>=4.68.0.20260608",
]

